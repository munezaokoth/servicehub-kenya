# Builds the ServiceHub Kenya Android app and publishes it as a GitHub Release.
#  - ServiceHub-Kenya.apk : direct download (servicehub.co.ke "Get the app" button)
#  - ServiceHub-Kenya.aab : upload to Google Play Console
# Runs when anything in mobile/ changes, or manually from the Actions tab (Run workflow).
#
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

name: Android app

on:
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SH_VERSION_CODE: ${{ github.run_number }}0
      SH_VERSION_NAME: 2.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Firebase config
        run: |
          if [ ! -s mobile/android/app/google-services.json ]; then
            echo "::error::mobile/android/app/google-services.json is missing. Download it from Firebase (Android app ke.co.servicehub.app) and commit it."
            exit 1
          fi

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install and sync Capacitor
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      - name: Restore signing key
        working-directory: mobile/android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build signed APK and App Bundle
        working-directory: mobile/android
        env:
          SH_KEYSTORE_PATH: release.keystore
          SH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release.apk ../../dist/ServiceHub-Kenya.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../dist/ServiceHub-Kenya.aab
          rm -f app/release.keystore
          ls -la ../../dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.SH_VERSION_NAME }}
          name: ServiceHub Kenya app ${{ env.SH_VERSION_NAME }}
          make_latest: true
          body: |
            ServiceHub Kenya for Android, version ${{ env.SH_VERSION_NAME }}.
            Download **ServiceHub-Kenya.apk** to install on your phone.
          files: |
            dist/ServiceHub-Kenya.apk
            dist/ServiceHub-Kenya.aab
