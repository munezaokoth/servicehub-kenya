<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ServiceHub Kenya</title>
<style>
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0b2a5b;color:#fff}
.w{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
.i{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:18px}
h1{font-size:1.35rem;margin:0 0 8px}p{opacity:.85;margin:0 0 22px;max-width:320px;line-height:1.45}
button{border:0;border-radius:999px;background:#22c55e;color:#fff;font-weight:700;font-size:1rem;padding:14px 28px}
small{margin-top:16px;opacity:.6}
</style></head>
<body><div class="w">
<div class="i">📶</div>
<h1>You're offline</h1>
<p>ServiceHub Kenya needs an internet connection. Check your data or Wi-Fi and try again.</p>
<button onclick="go()">Try again</button>
<small id="s"></small>
</div>
<script>
function go(){document.getElementById('s').textContent='Connecting…';location.href='https://servicehub.co.ke/?app=1';}
window.addEventListener('online',go);
setInterval(function(){if(navigator.onLine)go();},8000);
</script></body></html>
